<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>jQuery DOM Manipulation</title>
</head>
<body>
    <header>
        <h1>DOM Manipulation</h1>

        <nav>
            <a href="index.html">Introduction</a>
            <a href="effects.html">Effects</a>
            <a href="dom.html">DOM</a>
            <a href="animations.html">Animations</a>
            <a href="project.html">Mini Project</a>
        </nav>
    </header>

    <main>
        <h2>Part 3. DOM Manipulation with jQuery</h2>

        <section>
            <h3>Task 5. Add and Remove Elements</h3>

            <ul id="itemList">
                <li>Item 1</li>
            </ul>

            <button id="appendButton">Add Item</button>
            <button id="prependButton">Add at Start</button>
            <button id="removeButton">Remove Item</button>
        </section>

        <section>
            <h3>Task 6. Modifying Attributes</h3>

            <div>
                <img id="changeImage"
                     src="https://placehold.co/300x180/3498db/ffffff?text=First+Image"
                     alt="Example image">
            </div>

            <button id="imageButton">Change Image</button>

            <p>
                <a id="changeLink" href="https://www.google.com" target="_blank">
                    Visit Website
                </a>
            </p>

            <button id="linkButton">Change Link</button>
        </section>

        <section>
            <h3>Task 7. Form Interaction</h3>

            <form id="userForm">
                <input type="text" id="nameInput" placeholder="Enter your name">
                <input type="email" id="emailInput" placeholder="Enter your email">
            </form>

            <p>Name: <span id="nameOutput"></span></p>
            <p>Email: <span id="emailOutput"></span></p>
        </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="dom.js"></script>
</body>
</html>
