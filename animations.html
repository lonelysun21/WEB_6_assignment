<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>jQuery Animations</title>
</head>
<body>
    <header>
        <h1>jQuery Animations</h1>

        <nav>
            <a href="index.html">Introduction</a>
            <a href="effects.html">Effects</a>
            <a href="dom.html">DOM</a>
            <a href="animations.html">Animations</a>
            <a href="project.html">Mini Project</a>

    <main>
        <h2>Part 4. Animations</h2>

        <section>
            <h3>Task 8. Basic Animation</h3>

            <button id="basicButton">Start Animation</button>
            <button id="basicReset">Reset</button>

            <div class="animationArea">
                <div id="basicBox"></div>
            </div>
        </section>

        <section>
            <h3>Task 9. Sequential Animations</h3>

            <button id="sequenceButton">Start Sequence</button>
            <button id="sequenceReset">Reset</button>

            <div class="animationArea">
                <div id="sequenceBox"></div>
            </div>
        </section>

        <section>
            <h3>Task 10. Combined Animation</h3>

            <button id="combinedButton">Start Animation</button>
            <button id="combinedReset">Reset</button>

            <div class="animationArea">
                <div id="combinedBox"></div>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="animations.js"></script>
</body>
</html>
