<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>jQuery Effects</title>
</head>
<body>
    <header>
        <h1>jQuery Effects</h1>

        <nav>
            <a href="index.html">Introduction</a>
            <a href="effects.html">Effects</a>
            <a href="dom.html">DOM</a>
            <a href="animations.html">Animations</a>
            <a href="project.html">Mini Project</a>
        </nav>
    </header>

    <main>
        <h2>Part 2. jQuery Effects</h2>

        <section>
            <h3>Task 2. Visibility Methods</h3>

            <p id="visibilityText">
                This paragraph can be hidden and shown.
            </p>

            <button id="hideButton">Hide</button>
            <button id="showButton">Show</button>
            <button id="toggleButton">Toggle</button>
        </section>

        <section>
            <h3>Task 3. Fade Methods</h3>

            <div>
                <img id="fadeImage"
                     src="https://placehold.co/320x200/png?text=jQuery+Effects"
                     alt="jQuery Effects">
            </div>

            <button id="fadeInButton">Fade In</button>
            <button id="fadeOutButton">Fade Out</button>
            <button id="fadeToggleButton">Fade Toggle</button>
        </section>

        <section>
            <h3>Task 4. Slide Methods</h3>

            <button id="slideUpButton">Slide Up</button>
            <button id="slideDownButton">Slide Down</button>
            <button id="slideToggleButton">Slide Toggle</button>

            <div id="slidePanel">
                <p>This panel can slide up and down.</p>
            </div>
        </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="effects.js"></script>
</body>
</html>
